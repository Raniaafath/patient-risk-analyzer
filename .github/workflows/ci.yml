name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint the Python backend
  # Catches undefined names, bad imports, and
  # obvious errors before anything gets deployed.
  # ──────────────────────────────────────────────
  backend-lint:
    name: Backend — Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run flake8
        # --select=F catches real bugs (undefined names, unused imports that shadow things, etc.)
        # --max-line-length=127 is a common relaxed standard
        # Style-only issues (E/W codes) are left for a later formatting pass
        run: |
          flake8 backend/ \
            --select=F \
            --max-line-length=127 \
            --exclude=backend/__pycache__,backend/.venv,backend/venv

  # ──────────────────────────────────────────────
  # Job 2: Run the Python test suite
  # Pure-logic tests — no MongoDB required.
  # Covers LOS categorisation boundaries and the
  # SHAP class-index bug that was fixed earlier.
  # ──────────────────────────────────────────────
  backend-test:
    name: Backend — Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run pytest
        run: pytest backend/tests -v

  # ──────────────────────────────────────────────
  # Job 4: Type-check and build the React frontend
  # `npm run build` runs `tsc && vite build` —
  # so TypeScript errors fail the build here,
  # not silently in production.
  # ──────────────────────────────────────────────
  frontend-build:
    name: Frontend — Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build (TypeScript check + Vite bundle)
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────────
  # Job 5: Build Docker images
  # Verifies both Dockerfiles are valid and all
  # COPY/RUN steps succeed. Images are not pushed
  # yet — that comes in the CD pipeline.
  # ──────────────────────────────────────────────
  docker-build:
    name: Docker — Build images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: patient-risk-analyzer/backend:ci

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: patient-risk-analyzer/frontend:ci
